<!DOCTYPE html>
<html>
    <head>
        <title>Paragraph Generator</title>
        <style>
            .row {
                display: flex;
                align-items: center;
                justify-content: center;
                gap: 10px;
            }
            .row div:first-child {
                font-size: 20px;
                font-weight: bold;
            }
            .row input {
                width:100px;
                padding:5px;
                border-radius: 5px;
                border:0;
                font-size:20px;
                box-shadow: 0px 0px 2px gray;
            }
            .row button {
                background-color: #49a6e9;
                padding:5px;
                border-radius: 5px;
                border:0px;
                font-size: 20px;
                color:white;
                outline:none;
                border:none;
            }
            .row p {
                margin-top:10px;
                font-size: 16px;
                text-align:justify;
            }
        </style>
    </head>
    <body>
        <div id="main">
            <div class="row">
                <div>
                    Paragraph:
                </div>
                <div>
                    <input type="numnber" value="5" id="item">
                </div>
                <div>
                    <button onclick="generate()">Generate</button>
                </div>
            </div>
            <div class="row" style="display:block;" id="data"></div>
        </div>
    </body>

    const item = document.querySelector("#item");
     //console.log(item.value);
    const dataContainer = document.querySelector("#data");
    const generate = () => {
        console.log(item.value);
        if(isNaN(item.value) || item.value < 0 || item.value > 9) {
            const randomIndex = Math.floor(Math.random() * text.length);
           // console.log(randomIndex);
            dataContainer.innerHTML = `<p>${text[randomIndex]}</p>`;
        } else {
            const data = text.slice(0, item.value);
            const params = data.map(
                (d) => {
                    return `<p>${d}</p>`
                }
            )
            dataContainer.innerHTML = params.join("");
            // array to string
        }
    }
