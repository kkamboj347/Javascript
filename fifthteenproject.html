<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Portfolios</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                font-family: Arial, sans-serif;
            }

            body {
                background: #f4f4f4;
                padding: 40px;
            }
            .portfolio {
                max-width: 1200px;
                margin: auto;
            }
            .portfolio h2 {
                text-align: center;
                margin-bottom: 30px;
                font-size: 36px;
                color: #333;
            }
            .portfolio-grid {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 20px;
            }
            .portfolio-item {
                background: white;
                border-radius: 10px;
                overflow: hidden;
                box-shadow: 0 4px 10px rgba(0,0,0,0.1);
                transition: 0.3s;
            }
            .portfolio-item:hover {
                transform: translateY(-5px);
            }
             .portfolio-item img {
                width: 100%;
                height: 220px;
                object-fit: cover;
                display: block;
            }
           .portfolio-grid {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 20px;
            }
            .portfolio-item {
                background: white;
                border-radius: 10px;
                overflow: hidden;
                box-shadow: 0 4px 10px rgba(0,0,0,0.1);
                transition: 0.3s;
            }
            .portfolio-item:hover {
                transform: translateY(-5px);
            }
             .portfolio-item img {
                width: 100%;
                height: 220px;
                object-fit: cover;
                display: block;
            }
            .portfolio-content {
                padding: 15px;
            }
            .portfolio-content h3 {
                margin-bottom: 10px;
                color: #222;
            }
            .portfolio-content p {
                color: #666;
                font-size: 14px;
                line-height: 1.5;
            }
            /* Mobile View - 2 Columns */
            @media (max-width: 768px) {
                .portfolio-grid {
                    grid-template-columns: repeat(2, 1fr);
                }
            }
    </style>
    </head>
    <body>
        <section class="portfolio">

                    <div class="portfolio-content">
                        <h3>Project 1</h3>

                </div>
                <!-- second project -->

</html>
