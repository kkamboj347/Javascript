<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Portfolios</title>
        <style>
            * {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
                font-family: Arial, sans-serif;
            }

            body {
                background: #f4f4f4;
                padding: 40px;
            }
            .portfolio {
                max-width: 1200px;
                margin: auto;
            }
            .portfolio h2 {
                text-align: center;
                margin-bottom: 30px;
                font-size: 36px;
                color: #333;
            }
            .portfolio-grid {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                gap: 20px;
            }
    </style>
    </head>
    <body>
        <div class="">Porfolio Section</div>
    </body>
</html>
