<!DOCTYPE html>
<html>
    <head>
        <title>Brain Stroming Memory Game</title>
        <style>
            * {
                margin:0;
                padding:0;
            }
            :root {
                --bg-main: #464646;
                -bg-card: #2D2727;
                --border-color: #efc745;
            }
            body {
                display: flex;
                justify-content: center;
                align-items: center;
               flex-direction: column;
               gap: 5rem;
               height: 100vh;
               background-color: var(--bg-main) ; 
            }
            .card {
                width: 10rem;
                height: 10rem;
                background-color: var(--bg-card) ; 
                background-size: contain;
                border-radius:0.6rem;
                box-shadow: rgba(149, 157, 165, 0.2) 0px 8px 24px;
                padding: 2rem;

            }
            h1 {
                color: #fff;
                font-family: "Lexend Deca Light";
                font-size: 4rem;
            }
            span {
                color: var(--border-color);
            }
            #card-section {
                display: grid;
                grid-template-columns: repeat(3, 1fr);
                grid-gap:2rem;
            }
        </style>
    </head>
    <body>
        <h1>Math the <span>Images</span></h1>
        <section id="card-section">

        </section>
    </body>
    <script>
        let cardArrays = [
            {
                'name':"CSS",
                "img":"1"
            },
            {
                'name':"HTML",
                "img":"2",
            },
            {
                'name':"JS",
                "img":"3",
            },
            {
                'name':"JQuery",
                "img":"4",
            },
            {
                'name':"Node",
                "img":"5",
            },
            {
                'name':"Python",
                "img":"6"
            }
        ];
        const parentDiv = document.querySelector('#card-section');
        for(let i=0; i < cardArrays.length; i++) {
            const childDiv = document.createElement('div');
            childDiv.classList.add('card');
            childDiv.dataset.name = cardArrays[i].name;
            parentDiv.appendChild(childDiv);
        }
   </script>
</html>
