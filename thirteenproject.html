<!DOCTYPE html>
<html>
    <head>
        <title>Brain Stroming Memory Game</title>
        <style>
            * {
                margin:0;
                padding:0;
            }
            :root {
                --bg-main: #464646;
                -bg-card: #2D2727;
                --border-color: #efc745;
            }
            body {
                display: flex;
                justify-content: center;
                align-items: center;
               flex-direction: column;
               gap: 5rem;
               height: 100vh;
               background-color: var(--bg-main) ; 
            }
            /* .card {
                width: 10rem;
                height: 10rem;
                background-color: var(--bg-card) ; 
                background-size: contain;
                border-radiusa:0.6rem;
                box-shadow: rgba(149, 157, 165, 0.2) 0px 8px 24px;
                padding: 2rem;

            } */
             .card {
                position: relative;
                transition: all 0.4s linear;
                transform-style: preserve-3d;
                padding: 2rem;
             }
             .card, 
             .back-card, 
             .front-card {
                height: 10rem;
                width: 10rem;
             }
             .back-card, .front-card {
                position: absolute;
                backface-visibility: hidden;
             }
             .front-card {
                background-color: var(--border-color);
                background-size: contain;
                border-radius: 0.6rem;
                box-shadow: rgba(149, 157,165,0.2) 0px 8px 24px;
                padding:2rem;
            }
            .back-card {
                transform: rotate(180deg);
                background-size: contain;
                background-repeat: no-repeat;
                background-position: center;
                padding: 2rem;
                box-shadow: rgba(149, 157, 165, 0.2) 0px 8px 24px;
            }
            h1 {
                color: #fff;
                font-family: "Lexend Deca Light";
                font-size: 4rem;
            }
            span {
                color: var(--border-color);
            }
            #card-section {
                display: grid;
                grid-template-columns: repeat(4, 1fr);
                grid-gap:2rem;
            }
            .card_selected {
                border: 0.2rem solid var(--border-color);

            }
            .card_match {
                border: 0.2rem solid purple;


            }
        </style>
    </head>
    <body>
        <h1>Math the <span>Images</span></h1>
        <section id="card-section">

        </section>
    </body>
    <script>
        let cardArrays = [
            {
                'name':"CSS",
                 "img":"<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'>\
                <text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' \
                font-size='120' fill='rgba(0,0,0,0.1)'>1</text></svg>",
            },
            {
                'name':"HTML",
                 "img":"<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'>\
                <text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' \
                font-size='120' fill='rgba(0,0,0,0.1)'>2</text></svg>",
            },
            {
                'name':"JS",
                 "img":"<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'>\
                <text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' \
                font-size='120' fill='rgba(0,0,0,0.1)'>3</text></svg>",
            },
            {
                'name':"JQuery",
                 "img":"<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'>\
                <text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' \
                font-size='120' fill='rgba(0,0,0,0.1)'>4</text></svg>",
            },
            {
                'name':"Node",
                "img":"<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'>\
                <text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' \
                font-size='120' fill='rgba(0,0,0,0.1)'>5</text></svg>",
            },
            {
                'name':"Python",
                "img":"<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'>\
                    <text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' \
                    font-size='120' fill='rgba(0,0,0,0.1)'>6</text></svg>"
            }
        ];
        const parentDiv = document.querySelector('#card-section');
        // step 2 to duplicate each card 
        const gameCard = cardArrays.concat(cardArrays);
        // console.log(gameCard);

        // STEP 3 
        // Note that this method creates a new suffled array instead of modifying the original one.
        //  const myNumbers = (array) => {
        //     for (let i= array.length - 1; i > 0; i--){
        //         let j = Math.floor(Math.random() * (i + 1));
        //         let temp = array[i];
        //         array[i] = array[j];
        //         array[j] = temp;
        //     }
        //     return array
        //  }
        //const suffledChild = myNumbers(gameCard);

        let suffledChild = Array.from(gameCard).sort(() => 0.5 - Math.random());
        // step 4 
        let clickCount = 0;
        let firstCard = "";
        let secondCard = "";  
        // step 6 styling the match card 
        const card_matches = () => {
            let card_selected = document.querySelectorAll('.card_selected');
            card_selected.forEach((curElem) => {
                curElem.classList.add('card_match');
            })
        }
        // step 7 
        const resetGame = () => {
            clickCount = 0;
            firstCard = "";
            secondCard = "";

            let card_selected = document.querySelectorAll('.card_selected');
            card_selected.forEach((curElem) => {
                curElem.classList.remove('card_selected');
            })
        }
        parentDiv.addEventListener('click', (event) => {
            let curCard = event.target;
            clickCount++;
            if(clickCount < 3) {
                if(clickCount == 1) {
                    firstCard = curCard.dataset.name;
                    curCard.classList.add('card_selected');
                } else {
                    secondCard = curCard.dataset.name;
                    curCard.classList.add('card_selected');
                }
                if(firstCard !=="" && secondCard !== "" ) {
                    if(firstCard === secondCard) {
                        //curCard.classList.add('card_match');
                        setTimeout(() => {
                            card_matches();
                            resetGame();
                        }, 1000);
                    } else {
                        setTimeout(() => {
                            resetGame();
                        }, 1000);
                    }
                }
            }
            
            if(curCard.id === "card-section") {
                return false;
            }    
        });

        for(let i=0; i < suffledChild.length; i++) {
           // console.log(i);
            const childDiv = document.createElement('div');
            childDiv.classList.add('card');
            childDiv.dataset.name = suffledChild[i].name;
            const svg = suffledChild[i].img;
            const base64 = btoa(unescape(encodeURIComponent(svg)));
            //childDiv.style.backgroundImage =  `url("data:image/svg+xml;base64,${base64}")`;
            // childDiv.style.backgroundImage = `url(${cardArrays[i].img})`;
            const front_div = document.createElement('div');
            front_div.classList.add('front-card');

            const back_div = document.createElement('div');
            back_div.classList.add('back-card');
            back_div.style.backgroundImage =  `url("data:image/svg+xml;base64,${base64}")`;
            parentDiv.appendChild(childDiv);
            childDiv.appendChild(front_div);
            childDiv.appendChild(back_div);
        }
   </script>
</html>
