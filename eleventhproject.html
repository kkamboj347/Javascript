<!DOCTYPE html>
<html>
    <head>
        <title>Quiz Project</title>
        <style>
            body {
                background-color: skyblue;
            }
            .quiz-section {
                width: 50%;
                margin: 0 auto;
                padding: 50px;
            }
            div#quiz ul {
                padding: 0;
            }
            div#quiz {
                background: white;
                padding: 10px;
            }
            li {
                list-style: none;
                min-width: 40%;
                min-height: 5rem;
                margin: 10px;
                border-radius: 7rem;
                border: 0.2rem solid rgb(224, 224, 224);
                padding: 0 7rem 0 3rem;
                font-size: 1.8rem;
                font-weight: bold;
                display: flex;
                justify-content: flex-start;
                align-items: center;
            }
            label {
                padding-left: 1rem;
            }
            input {
                width: 20px;
                height: 20px;
            }
            input[type="radio"]:checked {
                background-color: #8ec5fc;
                border-color: #8ec5fc;
            }
            .btn {
                padding: 2rem rem;
            }
            button {
                padding: 1rem;
                background-color: #7090e7;
                border: none;
                color: #fff;
                font-size: 1.6rem;
                border-radius: 20px;
                cursor: pointer;
            }
            .result {
                width: 100%;
                height: auto;
                padding: 5rem;
                background-color: #fff;
                border-radius: 0.5rem;
                -webkit-border-radius: 0.5rem;
                -moz-border-radius: 0.5rem;
                -ms-border-radius: 0.5rem;
                -o-border-radius: 0.5rem;
                box-shadow: rgba(99, 99, 99, 0.2) 0px 2px 8px 0px;
                display:flex;
                flex-direction: column;
                gap: 2.4rem;
                align-items: center;
            }
            .result h2 {
                font-size: 3.4rem;
            }
            .result p {
                font-size: 2 rem;
            }

        </style>
    </head>
    <body>
        <div class="quiz-section">
            <div id="quiz">
                <h2 class="question" id="question">Quiz Question</h2>
                <hr />
                <ul>
                    <li>
                        <input type="radio" name="answer" class="answer" id="a"> 
                        <label for="a" id="option_1">Quiz Option</label>
                    </li>
                    <li>
                        <input type="radio" name="answer" class="answer" id="b">
                        <label for="b" id="option_2">Quiz Option</label>
                     </li>
                    <li>
                        <input type="radio" name="answer" class="answer" id="c">
                        <label for="c" id="option_3">Quiz Option</label>
                     </li>
                    <li>
                        <input type="radio" name="answer" class="answer" id="d">
                        <label for="d" id="option_4">Quiz Option</label>
                    </li>
                    <!-- <li>
                        <input  type="radio" name="answer" class="answer" id="e"> 
                        <label for="e" id="option_5">Quiz Option</label>
                    </li> -->
                </ul>
                <hr />
                <div class="btn">
                    <button type="submit" id="submit">Submit</button>
                </div>
            </div>
        </div>
    </body>
    <script>
        const quizData = [
            {
                question:"What does HTML stand for ?",
                options:[
                    "HyperText Markup Language",
                    "Hyper Transfer Markup Language",
                    "Hypertext Machince Language",
                    "HyperLink and Text Markup Language"
                ],
                correct: 0,
            },
            {
                question:"Which css property is used to control the spacing between element ?",
                options:[
                    "margin","padding","spacing","border-spacing"
                ],
                correct: 1,
            },
            {
                question:"Which is the Javascript function used to select an HTML element by its id ?",
                options:[
                    "document.query",
                    "selectElement",
                    "getElementById",
                    "findElementById"
                ],
                correct: 2,
            },
            {
                question: "In React.js which hook is used to perform side effect in a function component?",
                options: [
                    "useEffect","useState", "useContext","useReducer"
                ],
                correct: 0,
            },
            {
                question:"Which HTML tag is used to create an ordered list ?",
                options:["<ul>","<li>","<ol>","<dl>"],
                correct: 2
            }
        ];
        // step 2 : JAVASCRIPT INITIALIZATION
            const quiz = document.querySelector('#quiz');
            const answerEle = document.querySelectorAll('.answer');
            const [ questionEle, option_1, option_2, option_3, option_4 ] = document.querySelectorAll("#question, #option_1, #option_2, #option_3, #option_4 ");
            const submitBtn = document.querySelector("#submit");
            let currentQuiz = 0;
            let score = 0;

            // step 3: Load Quiz Function
            const loadQuiz = () => {
                const { question, options } = quizData[currentQuiz]; 
                console.log(question);
                questionEle.innerText = `${currentQuiz + 1}:${question}`;
                options.forEach((currOption, index) => window[`option_${index + 1}`].innerText = currOption);
            }
            loadQuiz();
        
        // Step 4: Get Selected Answer Function on Button Click
         const getSelectedOption = () => {
            // let ans_index;
            // answerEle.forEach((currOption, index) => {
            //     if(currOption.checked) {
            //         ans_index = index;
            //     }
            // });
            // return ans_index;
            let answerElement = Array.from(answerEle);
            return answerElement.findIndex((curEle) => curEle.checked);
         }

         // deselectAnswer
         const deselectAnswer = () => {
            return answerEle.forEach((curElem) => curElem.checked = false);
         }
         
         submitBtn.addEventListener('click', function() {
            const selectedOptionIndex = getSelectedOption();
            if(selectedOptionIndex == quizData[currentQuiz].correct) {
                score = score + 1;
            }
            currentQuiz++;
            if(currentQuiz < quizData.length) {
                deselectAnswer();
                loadQuiz();
            } else {
                quiz.innerHTML = `
                    <div class="result">
                        <h2> 🏆 Your Score: ${score}/${quizData.length} Correct Answers! </h2>
                        <p> Congratulations on Completing the Quiz.🎉 </p>
                        <button class="reload-button" onclick="location.reload()">Play Again 🔄</button>
                    </div>
                `;
            }
         })
    </script>
</html>
