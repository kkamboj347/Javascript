<!DOCTYPE html>
<html>
    <head>
        <title>
            Image Path Generator
        </title>
        <Style>
            body {
                width: 100%;
                display: block;
                text-align: center;
            }

            body section > div {
                padding: 12px;
            }
        </Style>
    </head>
    <body>
        <section>
            <h1>Placeholder Image Path Generator</h1>
            <div>
                <label for="selectImage">Image Size: </label>
                <select name="" id="selectImage">
                    <option value="150x50">Small (100x50)</option>
                    <option value="200x200">Medium Square (200x200)</option>
                    <option value="350x150">Medium (350x150)</option>
                    <option value="400x400">Large Square(400x400)</option>
                    <option value="650x350">Large (650x350)</option>
                    <option value="800x600">X-Large (800x600)</option>
                    <option value="1920x1080">Full HD (1920x1080)</option>
                </select>
            </div>
            <div class="parent">
                <label for="nameOnImage">Text On Image: </label><input type="text" name="" id="nameOnImage">
            </div>
            <div class="parent">
            <label for="backgroundColor">Color On Background: </label><input type="color" value="#98bc62" class="style" name="" id="backgroundColor">
            </div>
            <div class="parent">
            <label for="textColor">Color Of Text: </label><input type="color" value="#2C5F2D" class="style" name="" id="textColor">
            </div>
            <div class="container">'
                <img src="" alt="">
                <br>
                <label for="urlPath"></label>
                <textarea name="" id="urlPath" cols ="20" rows ="10">Link will be available here.</textarea>
            </div>
        </section>
        <script>
            const select = document.querySelector('select');
            const inputAll = document.querySelectorAll("input");
            const myImg = document.querySelector('img');
            const textarea = document.querySelector("textarea");

            let urlObj = {};
            const removeHashTag = (str) => {
                return str.replace("#","");
            }

            const createImagePath = () => {

                urlObj.size = select.value;
                urlObj.text = inputAll[0].value;
                urlObj.bgClr = removeHashTag(inputAll[1].value);
                urlObj.txtClr = removeHashTag(inputAll[2].value);

                //let urlPath =`http://via.placeholder.com/${select.value}/${inputAll[1].value}/${inputAll[2].value}/text=${inputAll[0].value}`;
                let urlPath =`http://via.placeholder.com/${urlObj.size}/${urlObj.bgClr}/${urlObj.txtClr}?text=${urlObj.text}`;
                myImg.src = urlPath;
                textarea.value = urlPath;
            }

            inputAll.forEach((curElm) => curElm.addEventListener('change', createImagePath));

            select.addEventListener('change', createImagePath);
        </script>
    </body>
</html>
