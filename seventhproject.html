<!DOCTYPE html>
<html>
    <head>
        <title>
            Notes Taking App  
        </title>
        <style>
            * {
                padding:0;
                margin:0;
                box-sizing: border-box;
            }
            #addbtn {
                position: fixed;
                right:10px;
                top:10px;
                background-color: #2d3436;
                color:white;
                padding:10px;
                outline: 0;
                border:0;
                border-radius:5px;
                display: flex;
                align-items: center;
                gap:5px;
                font-size:15px;
            }
            #main {
                width: 100%;
                min-height:100vh;
                background-color: #81ecec;
                display: flex;
                flex-wrap:wrap;
            }
            .note {
                width:400px;
                height:400px;
                margin:15px;
                background-color: white;
                margin-top:50px;
            }
            .tool {
                width:100%;
                background-color: #2d3436;
                color:white;
                padding:5px;
                display: flex;
                justify-content: end;;
            }
            .tool i {
                cursor: pointer;
                padding: 5px;
            }
            .note textarea {
                width:100%;
                height: 100%;
                border: none;
                resize: none;
                padding:10px;
                font-size:18px;
            }
            .note textarea:focus {
                border: 0;
                outline: 0;
            }
        </style>
    </head>
    <body>
        <button id="addbtn"> <i class="fas fa-plus"></i>Add Note</button>
        <div id="main">
            <div class="note">
                <div class="tool">
                    <i class="fas fa-save"></i>
                    <i class="fas fa-trash"></i>
                </div>
                <textarea name="" id=""></textarea>
            </div>
        </div>
    </body>
    <script src="https://kit.fontawesome.com/bf520e6492.js" crossorigin="anonymous"></script>
</html>
