<!DOCTYPE html>
<html>
    <head>
        <title>
            Notes Taking App  
        </title>
        <style>
            * {
                padding:0;
                margin:0;
                box-sizing: border-box;
            }
            #main {
                width: 100%;
                min-height:100vh;
                background-color: #81ecec;
                display: flex;
                flex-wrap:wrap;
            }
            .note {
                width:400px;
                height:400px;
                margin:15px;
                background-color: white;
            }
            .tool {
                width:100%;
                background-color: #2d3436;
                color:white;
                padding:5px;
            }
        </style>
    </head>
    <body>
        <div id="main">
            <div class="note">
                <div class="tool">

                </div>
            </div>
        </div>
    </body>
</html>
