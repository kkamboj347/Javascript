<!DOCTYPE html>
<html>
    <head>
        <title>To DO List</title>
        <style>
            * {
                padding:0;
                margin:0;
                box-sizing: border-box;
            }
            .container {
                width:100%;
                height: 100vh;
                background-color: #3498db;
                display: flex;
                justify-content: center;
                align-items: center;
            }
            .box {
                width:600px;
                min-height:500px;
                border-radius: 5px;
                background-color: white;
                padding:15px;
            }
            #item {
                font-size:20px;
                padding:10px;
                border:0;
                outline:0;
                box-shadow: 0px 0px 2px gray;
                width:100%;
            }
            #to-do-box {
                list-style: none;
                margin-top:20px;
            }
              #to-do-box li {
                background-color: #2c3e50;
                color:#fff;
                padding:10px;
                border-radius: 5px;
                position: relative;
                padding-right: 25px;
                text-align: justify;
                margin-top:10px;
                user-select: none;
              }
              #to-do-box li i {
                position: absolute;
                right:10px;
                top:10px;
              }
              #to-do-box li.done {
                text-decoration: line-through;
                color:black;
                background-color: #95a5a6;
              }
        </style>
    </head>
    <body>
        <div class="container">
            <div class="box">
                <input type="text" id="item" autofocus placeholder="Writing Something Here....">
                <ul id="to-do-box">
                   <!--  <li>Create a video
                        <i class="fa fa-times"></i>
                    </li>
                    <li></li>
                    <li></li> -->
                </ul>
            </div>
        </div>
    </body>
    <script src="https://kit.fontawesome.com/bf520e6492.js" crossorigin="anonymous"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
        const item = document.querySelector("#item");
        const toDoBox = document.querySelector("#to-do-box");
        item.addEventListener('keyup', function(event) {
            if(event.key == 'Enter'){
                addToDO(this.value);
                this.value = ""
            }
        });
         const addToDO = (item) => {
            const listItem = document.createElement('li');
            listItem.innerHTML = `
            ${item} 
            <i class="fa fa-times"></i>
            `;
            listItem.addEventListener('click', function() {
                this.classList.toggle("done");
            });
            listItem.querySelector('i').addEventListener('click', function() {
                listItem.remove();
            });
            toDoBox.appendChild(listItem);
         }

        });
        
    </script>
</html>
