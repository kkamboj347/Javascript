<!DOCTYPE html>
<html>
    <head>
        <title>Simple Calculator Project</title>
    </head>
    <body>
        <div class="formstyle"> 
            <form action="" name="forms" method="post">
                <input type="text" class="text" name ="answer"><br><br>
                <input type="button" class="button" value="1" onclick="forms.answer.value =+ '1'">
                <input type="button" class="button" value="2" onclick ="forms.answer.value=+ '2'">
                <input type="button" class="button" value="3">
                <input type="button" class="button" value="4">
                <input type="button" class="button" value="5">
                <input type="button" class="button" value="6">
                <input type="button" class="button" value="7">
                <input type="button" class="button" value="8">
                <input type="button" class="button" value="9">
            </form>
        </div>
    </body>
</html>
