<!DOCTYPE html>
<html>
    <head>
        <title>Random Color Generator</title>
        <style>
            * {
                margin:0;
                padding: 0;
                box-sizing: border-box;
            }
            h1{
                text-align: center;
                display: block;
                width:100%;
                color:white;
            }
            body {
                background-color: black;
            }
            .main {
                width:100%;
                height:100vh;
                display: flex;
                justify-content: center;
                align-items: center;
            }
            .container {
                width: 25rem;
                background-color: white;
                padding:10px;
                border-radius: 10px;
                text-align: center;
            }
            button {
                font-size: 35px;
                margin-top:5px;
                width:100%;
                display: block;
                color:white;
                border:none;
                border-radius: 5px;
                background-color: black;
                cursor:pointer;
            }
        </style>
    </head>
    <body>
        <h1>Random Color Generator</h1>
        <div class="main">
            <div class="container">
                <h2 id="color-code">#FFF</h2>
                <button id="btn">Click UP!</button>
            </div>
        </div>
    </body>
    <script>
        const getColor = () => {
            // Hex color code 
            const randomNumber = Math.random() * 16777215;
            console.log(randomNumber);   
        }
        document.getElementById('btn').addEventListener('click', getColor);
    </script>
</html>
